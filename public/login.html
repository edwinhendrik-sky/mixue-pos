<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sistem Absensi & Manajemen Mixue</title>
    <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/3076/3076129.png">
    <style>
        body { 
            font-family: Arial, sans-serif; 
            background: linear-gradient(135deg, #fff0f1 0%, #ffcdd2 100%); 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
        }
        .login-card { 
            background: white; 
            padding: 30px; 
            border-radius: 12px; 
            box-shadow: 0 10px 25px rgba(227, 27, 35, 0.2); 
            width: 100%; 
            max-width: 380px; 
            border-top: 8px solid #e31b23; 
            text-align: center;
        }
        .login-card img {
            width: 70px;
            height: 70px;
            object-fit: contain;
            margin-bottom: 10px;
        }
        h2 { color: #e31b23; margin-bottom: 20px; font-size: 22px; }
        .form-group { margin-bottom: 15px; text-align: left; }
        label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 13px; color: #444; }
        input { width: 100%; padding: 11px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 14px; }
        input:focus { border-color: #e31b23; outline: none; box-shadow: 0 0 5px rgba(227, 27, 35, 0.2); }
        button { width: 100%; padding: 12px; background-color: #e31b23; color: white; border: none; font-weight: bold; border-radius: 6px; cursor: pointer; font-size: 15px; transition: background 0.2s; margin-top: 10px; }
        button:hover { background-color: #c2151d; }
        .info-hint { margin-top: 15px; font-size: 12px; color: #666; line-height: 1.5; }
    </style>
</head>
<body>

<div class="login-card">
    <img src="logo-mixue.png" alt="Mixue Logo">
    <h2>Login Sistem Mixue</h2>
    
    <form onsubmit="handleLogin(event)">
        <div class="form-group">
            <label>ID Karyawan / Username:</label>
            <input type="text" id="employeeId" placeholder="Cth: CIM-001" required>
        </div>
        <div class="form-group">
            <label>Passwor:</label>
            <input type="password" id="password" placeholder="Masukkan password" required>
        </div>
        <button type="submit">Masuk Aplikasi</button>
    </form>

    <div class="info-hint">
        💡 <b>Info Akses:</b><br>
        • Karyawan: Gunakan ID Karyawan & Password 1234
    </div>
</div>

<script>
    async function handleLogin(event) {
        event.preventDefault();
        const employee_id = document.getElementById('employeeId').value.trim();
        const password = document.getElementById('password').value.trim();

        try {
            const res = await fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ employee_id, password })
            });
            const result = await res.json();

            if (result.success) {
                localStorage.setItem('employee', JSON.stringify(result.employee));
                
                // Arahkan ke halaman admin jika login sebagai admin
                if (result.employee.employee_id === 'admin') {
                    window.location.href = 'admin.html';
                } else {
                    window.location.href = 'index.html'; // Halaman absensi karyawan
                }
            } else {
                alert(result.message || 'Login gagal! Periksa kembali ID dan password Anda.');
            }
        } catch (err) {
            console.error(err);
            alert('Terjadi kesalahan koneksi ke server.');
        }
    }
</script>

</body>
</html>
